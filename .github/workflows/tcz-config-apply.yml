name: TCZ config apply

on:
  push:
    branches:
      - master
    paths:
      - infra/config/**
      - .github/workflows/tcz-config-apply.yml
  workflow_dispatch:

concurrency:
  group: tcz-config-stage
  cancel-in-progress: false

jobs:
  apply-stage:
    runs-on: ubuntu-latest
    env:
      STAGE_HOST: bbb-stage.thecode.zone
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for any client build/deploy on this commit
        run: |
          for i in $(seq 1 60); do
            BUSY=$(gh run list -R "$GITHUB_REPOSITORY" --workflow tcz-html5-build.yml \
              --commit "$GITHUB_SHA" --json status \
              -q '[.[] | select(.status != "completed")] | length')
            [ "$BUSY" = "0" ] && exit 0
            sleep 20
          done
          echo "client build still in progress after 20 minutes - applying now would race its stage deploy with a restart, giving up" >&2
          exit 1
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keyscan -H "$STAGE_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "stage box unreachable (deallocated after 21:00 UTC?) - 'just stage-up', then re-run this workflow" >&2
            exit 1
          fi
      - name: Apply config to stage
        run: bash infra/config/apply.sh stage
